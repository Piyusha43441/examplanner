# Replace database_id with the UUID returned by:
#   npx wrangler d1 create exam_planner_db
[[d1_databases]]
binding = "DB"
database_name = "exam_planner_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Private R2 bucket created by:
#   npx wrangler r2 bucket create exam-planner-payment-proofs
# Keep public access disabled on this bucket. All proof reads go through authenticated Worker routes.
[[r2_buckets]]
binding = "PROOF_BUCKET"
bucket_name = "exam-planner-payment-proofs"
